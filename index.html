<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%favicon-32.png?v=20261102-landscape" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%brand-mark.svg?v=20261102-landscape" />
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%apple-touch-icon.png?v=20261102-landscape" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0b0d" />
    <script>try { const p = localStorage.getItem("misty_rain_theme"); const t = p === "dark" || p === "light" ? p : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"; document.documentElement.dataset.theme = t; document.documentElement.style.colorScheme = t; } catch { document.documentElement.dataset.theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"; }</script>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="烟雨影视" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <title>烟雨影视 · Misty Rain</title>
    <style>
      :root[data-theme="light"] { --liquid-canvas: #f4f6fa; --text-primary: #1b2432; --text-secondary: #475467; }
      html, body, #app { width: 100%; min-height: 100%; margin: 0; background: var(--liquid-canvas, #0b0b0d); }
      #app { min-height: 100vh; min-height: 100dvh; }
      .app-boot { position: fixed; inset: 0; display: grid; width: 100%; height: 100vh; height: 100dvh; min-height: 100svh; box-sizing: border-box; place-items: center; padding: calc(24px + env(safe-area-inset-top, 0px)) calc(24px + env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) calc(24px + env(safe-area-inset-left, 0px)); color: var(--text-primary, #eef1f6); background: var(--liquid-canvas, #0b0b0d); font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; }
      .app-boot__content { display: grid; justify-items: center; gap: 14px; text-align: center; }
      .app-boot__mark { width: 54px; height: 54px; object-fit: contain; }
      .app-boot__title { margin: 0; font-size: 20px; font-weight: 650; letter-spacing: -.02em; }
      .app-boot__hint { margin: 0; color: var(--text-secondary, #a1adbd); font-size: 14px; }
      .app-boot__retry { display: none; min-height: 44px; align-items: center; justify-content: center; padding: 0 22px; color: #a0b9db; border: 1px solid rgba(255,255,255,.22); border-radius: 999px; background: rgba(255,255,255,.12); text-decoration: none; }
      .app-boot.is-delayed .app-boot__hint { display: none; }
      .app-boot.is-delayed .app-boot__retry { display: flex; }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="app-boot" id="app-boot" role="status">
        <div class="app-boot__content">
          <img class="app-boot__mark" src="%BASE_URL%brand-mark.svg?v=20261102-landscape" alt="" aria-hidden="true" />
          <p class="app-boot__title">烟雨影视</p>
          <p class="app-boot__hint">正在启动…</p>
          <a class="app-boot__retry" href="%BASE_URL%?webclip=1&retry=1">重新加载</a>
        </div>
      </div>
    </div>
    <script>window.setTimeout(function(){var e=document.getElementById('app-boot');if(e)e.classList.add('is-delayed')},8000)</script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
