services:
  misty-rain-video:
    image: ${IMAGE_NAME:-ghcr.io/holt230/misty-rain-video}:${IMAGE_TAG:-amd64}
    container_name: misty-rain-video
    restart: unless-stopped
    init: true
    ports:
      - "5200:5173"
    environment:
      HOST: 0.0.0.0
      PORT: 5173
      TZ: ${TZ:-Asia/Shanghai}
      QUARK_CONFIG_SECRET: ${QUARK_CONFIG_SECRET:-}
      # 可替换为自建的兼容 HTTPS 令牌交换服务；不要使用 HTTP 地址。
      TV_TOKEN_EXCHANGE_URL: ${TV_TOKEN_EXCHANGE_URL:-https://api.extscreen.com/quarkdrive/token}
      # auto 优先使用 TV 渐进式直连；proxy 可恢复全部服务器中转。
      PLAYER_MEDIA_DELIVERY: ${PLAYER_MEDIA_DELIVERY:-auto}
      APP_USERS_JSON: >-
        [
          {"username":"admin","password":"666666","role":"admin","folder":"admin"}
        ]
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-}
      APP_PROFILE_IDENTIFIER: ${APP_PROFILE_IDENTIFIER:-com.mistyrain.video}
      AUTH_SESSION_DAYS: 30
      LIBRARY_ROOT_FOLDER: 烟雨影视
      LEGACY_LIBRARY_ROOT_FOLDER: 烟雨视频
      LIBRARY_AUTO_MAINTENANCE: ${LIBRARY_AUTO_MAINTENANCE:-true}
      LIBRARY_MAINTENANCE_MINUTES: ${LIBRARY_MAINTENANCE_MINUTES:-30}
      # 使用本轮实际结果，不进行后台补查。公开频道需显式启用且服务器可访问。
      RESOURCE_SEARCH_SOURCE: all
      RESOURCE_SEARCH_TIMEOUT_MS: ${RESOURCE_SEARCH_TIMEOUT_MS:-8000}
      RESOURCE_SEARCH_URLS: ${RESOURCE_SEARCH_URLS:-}
      RESOURCE_SEARCH_CHANNELS: ${RESOURCE_SEARCH_CHANNELS:-}
    volumes:
      - misty-rain-data:/app/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5173/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  misty-rain-data:
    name: misty-rain-video-data
