  <circle cx="43" cy="19" r="6.9" fill="url(#moon)"/>
  <path d="M0 47L20.3 19.7Q22.1 17.5 24.1 20.2L37.2 36.9L44.2 28.1Q45.8 26.3 47.6 28.4L64 48V64H0Z" fill="url(#far)" filter="url(#relief)"/>
  <path d="M7 37L20.3 19.7Q22.1 17.5 24.1 20.2L37.2 36.9L44.2 28.1Q45.8 26.3 47.6 28.4L57 40" fill="none" stroke="#EFE6CF" stroke-opacity=".10" stroke-width=".6" stroke-linejoin="round"/>
  <path d="M0 51L13.8 34.8Q15.6 32.5 18 34.2L30.5 43.5Q34 46 38.2 43.4L46.7 38.2Q49 36.7 51.6 38.7L64 50V64H0Z" fill="url(#near)" filter="url(#relief)"/>
