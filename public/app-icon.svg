<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 64 64"><title>烟雨影视 · 雾金毛玻璃</title><defs>
  <filter id="etched" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation=".15"/></filter>
  <filter id="frost-grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="3.2" numOctaves="2" seed="21" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="linear" slope=".18"/></feComponentTransfer>
  </filter>
  <radialGradient id="glass-film" cx=".22" cy=".12" r="1">
    <stop stop-color="#FFFFFF" stop-opacity=".20"/>
    <stop offset=".5" stop-color="#D8E5EA" stop-opacity=".055"/>
    <stop offset="1" stop-color="#FFFFFF" stop-opacity=".025"/>
  </radialGradient>
  <linearGradient id="glass-edge" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#FFFFFF" stop-opacity=".55"/>
    <stop offset=".38" stop-color="#FFFFFF" stop-opacity=".08"/>
    <stop offset=".75" stop-color="#FFFFFF" stop-opacity=".04"/>
    <stop offset="1" stop-color="#FFFFFF" stop-opacity=".22"/>
  </linearGradient>
</defs><defs><radialGradient id="background" cx=".25" cy=".1" r="1.1"><stop stop-color="#302F2C"/><stop offset=".5" stop-color="#141517"/><stop offset="1" stop-color="#080A0C"/></radialGradient></defs><rect width="64" height="64" fill="url(#background)"/><g transform="translate(6.4 6.4) scale(.8)"><defs>
  <radialGradient id="sky" cx=".58" cy=".18" r=".85"><stop stop-color="#3E3C37"/><stop offset=".52" stop-color="#252827"/><stop offset="1" stop-color="#111718"/></radialGradient>
  <linearGradient id="rim" x1=".12" y1="0" x2=".88" y2="1"><stop stop-color="#C0B08F" stop-opacity=".8"/><stop offset=".42" stop-color="#373C3B" stop-opacity=".25"/><stop offset="1" stop-color="#776D56" stop-opacity=".65"/></linearGradient>
  <linearGradient id="far" x1=".1" y1="0" x2=".8" y2="1"><stop stop-color="#B5AD99"/><stop offset=".42" stop-color="#777C70"/><stop offset="1" stop-color="#3C514C"/></linearGradient>
  <linearGradient id="near" x1=".15" y1="0" x2=".9" y2="1"><stop stop-color="#778279"/><stop offset=".5" stop-color="#334D46"/><stop offset="1" stop-color="#142B28"/></linearGradient>
  <linearGradient id="mist" x1="8" y1="39" x2="53" y2="58" gradientUnits="userSpaceOnUse"><stop stop-color="#EFE6CF"/><stop offset=".4" stop-color="#C1AF87"/><stop offset=".72" stop-color="#EFE6CF"/><stop offset="1" stop-color="#7E7A64"/></linearGradient>
  <radialGradient id="moon" cx=".3" cy=".22" r=".8"><stop stop-color="#FBF2D9"/><stop offset=".55" stop-color="#DBC394"/><stop offset="1" stop-color="#A78958"/></radialGradient>
  <linearGradient id="beam" x1="43" y1="19" x2="20" y2="49" gradientUnits="userSpaceOnUse"><stop stop-color="#DCCBA7" stop-opacity=".2"/><stop offset="1" stop-color="#DCCBA7" stop-opacity="0"/></linearGradient>
  <clipPath id="window"><circle cx="32" cy="32" r="27.5"/></clipPath>
  <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="1.7"/></filter>
  <filter id="relief" x="-15%" y="-25%" width="130%" height="150%"><feDropShadow dx="0" dy=".8" stdDeviation=".7" flood-color="#000000" flood-opacity=".2"/></filter>
</defs>
<circle cx="32" cy="32.6" r="28.4" fill="#000000" opacity=".35"/>
<g clip-path="url(#window)"><g filter="url(#etched)">
