</g><circle cx="32" cy="32" r="27.5" fill="url(#glass-film)"/><circle cx="32" cy="32" r="27.5" filter="url(#frost-grain)" opacity=".6"/></g>
<circle cx="32" cy="32" r="27.8" fill="none" stroke="url(#glass-edge)" stroke-width=".65"/>
<path d="M10.5 14.7A27.8 27.8 0 0 1 35 4.4" fill="none" stroke="#EFE6CF" stroke-opacity=".23" stroke-width=".45" stroke-linecap="round"/></g></svg>
